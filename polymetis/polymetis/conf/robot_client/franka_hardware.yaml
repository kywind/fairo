hz: 1000
use_real_time: true
exec: franka_panda_client

robot_client:
  _target_: polymetis.robot_client.executable_robot_client.ExecutableRobotClient
  use_real_time: ${use_real_time}
  metadata_cfg:
    _target_: polymetis.robot_client.metadata.RobotClientMetadata
    default_Kq: [80, 60, 100, 50, 70, 50, 20]
    default_Kqd: [5.656854249492381, 8.485281374238571, 7.0710678118654755, 7.0710678118654755, 4.242640687119286, 2.8284271247461903, 1.4142135623730951]
    default_Kx: [800, 800, 800, 30, 30, 30]
    default_Kxd: [52.32590180780452, 52.32590180780452, 52.32590180780452, 2.8284271247461903, 2.8284271247461903, 2.8284271247461903]
    hz: ${hz}
    robot_model_cfg: ${robot_model}
  executable_cfg:
    robot_ip: "128.59.17.200"
    control_ip: ${ip}
    control_port: ${port}
    readonly: false
    mock: false
    use_real_time: ${use_real_time}
    hz: ${hz}
    num_dofs: ${robot_model.num_dofs}
    exec: ${exec}
    robot_client_metadata_path: ???
    # Camera/mount only; stock hand remains in Desk. Exact symmetric inertia, column-major.
    payload:
      enabled: true
      mass: 0.08065
      com:
      - 0.03707881250596734
      - -0.0400727506462488
      - 0.04500162992071231
      inertia:
      - 2.9834354643122414e-05
      - 4.37994973819311e-06
      - -5.861781270419889e-06
      - 4.37994973819311e-06
      - 2.954715709586219e-05
      - 5.979785605770485e-06
      - -5.861781270419889e-06
      - 5.979785605770485e-06
      - 3.27658258054975e-05
      expected_ee_mass: 0.73
      expected_ee_com:
      - -0.01
      - 0
      - 0.03
      expected_ee_inertia:
      - 0.001
      - 0
      - 0
      - 0
      - 0.0025
      - 0
      - 0
      - 0
      - 0.0017
      source_urdf_sha256: 4312edee3ccf54ce78e1e36408ed2ec6a4fd12df88e056853e1ed3565bed3e7c


    limit_rate: true
    lpf_cutoff_frequency: 100

    limits: 
      # bounding box of the workspace
      cartesian_pos_upper:
        - 1.0
        - 1.0
        - 1.0
      cartesian_pos_lower:
        - -1.0
        - -1.0
        - -1.0

      # FR3v2 position bounds from the connected robot; existing speed and torque caps retained
      joint_pos_upper: # Robot-provided FR3v2 bounds; soft margin retained.
        - 2.9007400166666666
        - 1.8360900166666667
        - 2.9007400166666666
        - -0.11693708333333333
        - 2.87630335
        - 4.62163335
        - 3.05083335
      joint_pos_lower: # Robot-provided FR3v2 bounds; soft margin retained.
        - -2.9007400166666666
        - -1.8360900166666667
        - -2.9007400166666666
        - -3.077020016666667
        - -2.87630335
        - 0.43982265
        - -3.05083335
      joint_vel: #margin: 0.1 rad/s
        - 2.075
        - 2.075
        - 2.075
        - 2.075
        - 2.51
        - 2.51
        - 2.51
      elbow_vel: 2.075      #margin: 0.1 rad/s
      joint_torques:  #margin: 1N for first 4 joints, 0.5N for last 3 joints
        - 86.0
        - 86.0
        - 86.0
        - 86.0
        - 11.5
        - 11.5
        - 11.5

    collision_behavior:
      lower_torque: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      upper_torque: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      lower_force: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]
      upper_force: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]

    safety_controller:
      is_active: true
      margins: # margin from hard safety limits at which safety controllers start to kick in
        cartesian_pos: 0.05
        joint_pos: 0.2
        joint_vel: 0.5
      stiffness:
        cartesian_pos: 200.0
        joint_pos: 50.0
        joint_vel: 20.0
